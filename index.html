<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f2">
<meta name="description" content="Build an automated power plant in Critical Mass, an isometric incremental game.">
<title>Critical Mass</title>
<style>:root {
  color-scheme: light;
  --ink: #242b28;
  --muted: #606a64;
  --soft: #e4e8e1;
  --paper: #f9faf7;
  --line: #d7dcd4;
  --orange: #c34e2d;
  --lime: #bbdf6b;
  --violet: #795a9c;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  --sans: 'Inter', 'Segoe UI', sans-serif;
  font: 16px var(--sans);
}
*, *::before, *::after { box-sizing: border-box; }
html, body, #game { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { color: var(--ink); background: #ecefea; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #9d4329; outline-offset: 3px; }
[hidden] { display: none !important; }
#world { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#world.dragging { cursor: grabbing; }
#world.placing { cursor: crosshair; }
#world.machine-hover { cursor: pointer; }
#world.moving { cursor: grabbing; }
#world.ruben-hover { cursor: grab; }
#world.holding { cursor: grabbing; }
.icon { display: block; width: 19px; height: 19px; flex: none; }
.world-frame { position: absolute; inset: 86px 20px 83px; pointer-events: none; }
.world-frame i { position: absolute; width: 13px; height: 13px; border: solid #abb5a9; opacity: .65; }
.world-frame i:nth-child(1) { top: 0; left: 0; border-width: 1px 0 0 1px; }
.world-frame i:nth-child(2) { top: 0; right: 0; border-width: 1px 1px 0 0; }
.world-frame i:nth-child(3) { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
.world-frame i:nth-child(4) { bottom: 0; right: 0; border-width: 0 1px 1px 0; }
.hud {
  position: absolute; z-index: 6; top: 0; inset-inline: 0; height: 70px;
  display: flex; gap: 10px; align-items: stretch; justify-content: space-between;
  padding: 0 24px; background: #f8f9f6; border-bottom: 1px solid #cdd4ca;
  box-shadow: 0 3px 12px #35432e0b;
}
.brand { display: flex; gap: 10px; align-items: center; flex: 0 0 auto; }
.brand-mark { width: 35px; height: 35px; display: grid; place-items: center; color: #fff; background: #28342b; border-radius: 5px; }
.brand-mark .icon { width: 24px; height: 24px; }
.wordmark { font-size: 17px; font-weight: 820; letter-spacing: -.055em; white-space: nowrap; line-height: 1; }
.wordmark span { color: #414b43; }
.brand-sub { margin-top: 5px; font: 600 9px var(--mono); letter-spacing: .23em; color: var(--muted); }
.resources { display: flex; align-self: stretch; }
.resource {
  position: relative; display: flex; gap: 10px; align-items: center; min-width: 118px; padding: 0 15px; border-left: 1px solid #e0e4dc; outline-offset: -4px;
}
.resource:nth-child(2) { min-width: 150px; }
.resource:last-child { border-right: 1px solid #e0e4dc; }
.resource-icon { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 5px; }
.resource-icon .icon { width: 16px; height: 16px; }
.flux-icon { font: 700 21px var(--sans); background: #f6e9d0; color: #865618; }
.energy-icon { background: #e5eed5; color: #537438; }
.output-icon { background: #e1ebe8; color: #3c7064; }
.resource-label { display: block; color: #546158; font: 600 10px var(--mono); letter-spacing: .08em; }
.resource-value { margin-top: 4px; font: 650 17px/1 var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.resource-value small { color: #58635b; font-size: 11px; font-weight: 500; }
.resource-meter { position: absolute; inset: auto 15px 7px; height: 2px; background: #e1e7da; }
.resource-meter i { display: block; height: 100%; width: 0; background: #79a647; transition: width .16s; }
.resource[data-tip]:hover::after, .resource[data-tip]:focus-visible::after {
  content: attr(data-tip); position: absolute; z-index: 10; top: calc(100% + 8px); left: 0; width: 205px; padding: 9px 11px;
  color: #fff; background: #303a32; border-radius: 4px; font-size: 12px; line-height: 1.45; pointer-events: none;
}
.hud-end { display: flex; align-items: center; gap: 12px; }
.save-status { display: flex; gap: 6px; align-items: center; white-space: nowrap; color: #56635a; font: 500 10px var(--mono); }
.save-status i { width: 6px; height: 6px; border-radius: 50%; background: #71944b; }
.save-status.error i { background: var(--orange); }
.icon-button { width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: #fcfdf9; }
.icon-button:hover { background: #e9eee3; }
.hud-button { height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: 4px; background: #fcfdf9; color: #5a5134; font: 600 10px var(--mono); letter-spacing: .08em; white-space: nowrap; }
.hud-button:hover { background: #f1eedd; }
.hud-button.ready { border-color: #b08a3c; background: #f8f1d8; color: #6a5216; }
.world-switch { position: absolute; z-index: 4; top: 146px; left: 30px; display: grid; gap: 4px; width: 234px; padding: 8px; border: 1px solid #d3dacdc0; border-radius: 6px; background: #f6f8f2d6; backdrop-filter: blur(3px); }
.world-chip { display: grid; grid-template-columns: 9px 1fr auto; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid #c8d0c3; border-radius: 3px; background: #f9faf5; color: #374039; font: 600 10px var(--mono); letter-spacing: .05em; text-align: left; text-transform: uppercase; }
.world-chip i { width: 7px; height: 7px; border: 1px solid #829083; transform: rotate(45deg); }
.world-chip b { color: #5d6a5d; font-weight: 500; text-transform: none; }
.world-chip:hover { background: #e6ebdf; }
.world-chip.active { background: #f6f8f1; border-color: #6a7d69; color: #24352a; }
.world-chip.active i { background: #6a7d69; border-color: #6a7d69; }
.world-switch p { margin: 5px 1px 0; color: #4f5c52; font-size: 11px; line-height: 1.4; }
.world-switch small { margin: 2px 1px 0; color: #6c796d; font: 500 8px var(--mono); letter-spacing: .06em; }
.panel.legacy-menu { width: min(372px, calc(100% - 32px)); }
.hud-button.plain { color: #46554a; }
.panel.discovery-menu { top: 94px; left: 50%; translate: -50% 0; width: min(760px, calc(100% - 40px)); max-height: calc(100% - 165px); animation: fade-in .16s ease-out both; }
.rarity-filter { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 12px; }
.rarity-chip { padding: 5px 8px; border: 1px solid #d3dacd; border-left: 3px solid var(--rarity, #8a968c); border-radius: 3px; background: #f5f7f1; color: #46554a; font: 600 9.5px var(--mono); letter-spacing: .05em; }
.rarity-chip:hover { background: #e9eee3; }
.rarity-chip.active { background: #24352a; border-color: #24352a; border-left-color: var(--rarity, #24352a); color: #f6faf1; }
.discovery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.discovery-card { display: grid; grid-template-columns: 34px 1fr; gap: 4px 9px; align-content: start; padding: 9px 10px; border: 1px solid #dce3d7; border-top: 3px solid var(--rarity); border-radius: 4px; background: #f8f9f5; }
.discovery-card.unknown { background: #eef1eb; border-top-color: color-mix(in srgb, var(--rarity) 45%, #dce3d7); }
.discovery-icon { grid-row: span 2; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: color-mix(in srgb, var(--rarity) 13%, #fff); color: var(--rarity); font: 700 15px var(--mono); }
.discovery-card.unknown .discovery-icon { background: #dfe4dc; color: #8e988f; }
.discovery-icon svg { width: 20px; height: 20px; }
.discovery-title strong { display: block; font-size: 12.5px; line-height: 1.2; }
.discovery-title small { color: var(--rarity); font: 700 9px var(--mono); letter-spacing: .08em; }
.discovery-card p { grid-column: 1 / -1; margin: 3px 0 0; color: #4c584f; font-size: 11.5px; line-height: 1.38; }
.discovery-card.unknown p { color: #7d877e; }
.discovery-bonus { grid-column: 1 / -1; margin-top: 2px; color: #2f4637; font: 650 11px var(--mono); }
.discovery-tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.keep-tag, .active-tag { padding: 2px 5px; border: 1px solid #ccd5c7; border-radius: 3px; color: #627064; font: 600 8.5px var(--mono); letter-spacing: .07em; }
.keep-tag.permanent { border-color: #c8ad6b; background: #f8f1d8; color: #6a5216; }
.active-tag { border-color: #a9c38f; background: #eef5e5; color: #3f6030; }
.keep-legend { color: #5d6a5d; font-size: 11px; }
.keep-legend .keep-tag { margin-left: 2px; }
.discovery-note em { display: block; margin-top: 2px; color: #6c796d; font: italic 10.5px var(--sans); }
.discovery-date { grid-column: 1 / -1; color: #6c796d; font: 500 9.5px var(--mono); }
.discovery-note { position: absolute; z-index: 9; right: 23px; bottom: 74px; display: flex; gap: 10px; align-items: flex-start; width: 252px; padding: 10px 12px; border: 1px solid #d3dacd; border-left: 4px solid var(--rarity); border-radius: 5px; background: #fafbf7f5; box-shadow: 0 6px 18px #39473522; cursor: pointer; }
.discovery-note.arrive { animation: discovery-in 5.6s ease both; }
@keyframes discovery-in { 0% { opacity: 0; translate: 0 10px; } 6% { opacity: 1; translate: 0 0; } 88% { opacity: 1; translate: 0 0; } 100% { opacity: 0; translate: 0 4px; } }
.discovery-note .discovery-icon { grid-row: auto; flex: none; box-shadow: 0 0 0 0 var(--rarity); animation: discovery-glow 1.4s ease-out .15s; }
@keyframes discovery-glow { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--rarity) 55%, transparent); } to { box-shadow: 0 0 0 12px transparent; } }
.discovery-note small, .discovery-note strong, .discovery-note b, .discovery-note span { display: block; }
.discovery-note small { color: #6c796d; font: 600 9px var(--mono); letter-spacing: .1em; }
.discovery-note strong { margin-top: 3px; font-size: 14px; }
.discovery-note b { margin-top: 2px; color: var(--rarity); font: 700 9.5px var(--mono); letter-spacing: .08em; }
.discovery-note div > span { margin-top: 4px; color: #4c584f; font-size: 11.5px; }
.hud-button.plain:hover { background: #e9eee3; }
.panel.reader { top: 94px; left: 50%; translate: -50% 0; width: min(560px, calc(100% - 40px)); max-height: calc(100% - 165px); animation: fade-in .16s ease-out both; }
.reader .page p { font-size: 14px; line-height: 1.62; margin: 6px 0 14px; }
.reader .page .page-short { font-size: 16px; line-height: 1.45; color: #24352a; margin: 8px 0 16px; }
.reader .page .action { min-width: 180px; margin-bottom: 6px; }
.reader .page-foot { margin-top: 14px; padding-top: 12px; border-top: 1px solid #dce3d8; }
.reader .page-foot .action { flex: 0 0 auto; min-width: 0; margin: 0; }
.library-list { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 7px 0 15px; }
.library-list small { grid-column: 1 / -1; color: #6c796d; font: 500 10px var(--mono); margin-top: 2px; }
.library-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid #dce3d7; border-radius: 4px; background: #f5f7f1; font-size: 12.5px; text-align: left; }
.library-item:hover { border-color: #8ea483; background: #e9f0e1; }
.library-item i { flex: none; width: 9px; height: 9px; border: 1px solid #8a998c; border-radius: 50%; }
.library-item i.read-0 { background: linear-gradient(90deg, #8a998c 34%, transparent 34%); }
.library-item i.read-1 { background: linear-gradient(90deg, #6f8f5a 67%, transparent 67%); border-color: #6f8f5a; }
.library-item i.read-2 { background: #6f8f5a; border-color: #6f8f5a; }
.read-link { display: block; width: max-content; margin: 0 0 10px; padding: 0; border: 0; background: none; color: #4c6d78; font: 600 10px var(--mono); letter-spacing: .05em; text-transform: uppercase; text-decoration: underline; text-decoration-color: #a9bfc6; text-underline-offset: 3px; }
.read-link:hover { color: #24424c; }
.hover-card { position: absolute; z-index: 6; width: 250px; padding: 9px 11px; border: 1px solid #c9d1c5; border-radius: 5px; background: #fafbf7f2; box-shadow: 0 6px 16px #39473520; pointer-events: none; }
.hover-card strong, .hover-card span, .hover-card small { display: block; }
.hover-card strong { font-size: 13px; }
.hover-card span { margin-top: 3px; color: #4c584f; font-size: 12px; line-height: 1.35; }
.hover-card small { margin-top: 6px; color: #5d6a5d; font: 600 9.5px var(--mono); letter-spacing: .04em; }
.legacy-worth { color: #5a5134; }
.legacy-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0 12px; }
.legacy-lists ul { margin: 6px 0 0; padding-left: 15px; color: #4c584f; font-size: 11.5px; line-height: 1.5; }
.perk-list { margin-top: 8px; }
.perk { display: grid; grid-template-columns: 1fr auto; gap: 8px; width: 100%; padding: 8px 10px; border: 1px solid #dce3d7; border-radius: 4px; background: #f5f7f1; text-align: left; }
.perk:hover:not(:disabled) { border-color: #b08a3c; background: #f8f3df; }
.perk:disabled { color: #56635a; }
.perk strong, .perk small { display: block; }
.perk strong { font-size: 13px; }
.perk small { margin-top: 3px; color: #526458; font-size: 11px; line-height: 1.25; }
.site-label { position: absolute; top: 106px; left: 38px; display: flex; align-items: flex-start; gap: 9px; pointer-events: none; }
.site-marker { width: 10px; height: 10px; border: 1px solid #829083; transform: rotate(45deg); margin-top: 2px; }
.site-marker::after { content: ''; position: absolute; inset: 2px; background: #829083; }
.site-label strong, .site-label div > span { display: block; font-family: var(--mono); }
.site-label strong { font-size: 11px; letter-spacing: .11em; }
.site-label div > span { color: #637064; margin-top: 5px; font-size: 9px; letter-spacing: .06em; }
#machine-labels { position: absolute; inset: 70px 0 70px; pointer-events: none; overflow: hidden; }
.machine-tag {
  position: absolute; display: flex; align-items: center; gap: 7px; white-space: nowrap; transform: translate(-50%, -100%);
  background: #f9faf5; color: #374039; border: 1px solid #c8d0c3; padding: 6px 8px; border-radius: 3px;
  font: 600 10px var(--mono); box-shadow: 0 2px 5px #32422c18; pointer-events: auto;
}
.machine-tag::after { content: ''; position: absolute; height: 9px; width: 1px; top: 100%; left: 50%; background: #a4afa2; }
.machine-tag .tag-dot { width: 6px; height: 6px; background: var(--tag-color); border-radius: 50%; }
.machine-tag.active { background: #f6f8f1; border-color: #6a7d69; color: #24352a; }
.machine-tag:hover { background: #e6ebdf; }
#crew-name {
  position: absolute; z-index: 4; pointer-events: none; transform: translate(-50%, -100%);
  padding: 4px 7px; border: 1px solid #b7a9c6; border-radius: 3px; color: #443852;
  background: #faf7fc; box-shadow: 0 2px 5px #46355622; font: 650 11px var(--mono);
}
#crew-name strong, #crew-name small { display: block; }
#crew-name small { margin-top: 2px; color: #6a6075; font: 500 10.5px var(--sans); }
#crew-name::after {
  content: ''; position: absolute; width: 1px; height: 5px; top: 100%; left: 50%; background: #9783ac;
}
.floor-controls {
  position: absolute; z-index: 5; inset: auto 23px 21px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px;
  pointer-events: none;
}
.floor-controls > div { pointer-events: auto; }
.build-control { display: flex; align-items: center; gap: 13px; }
.build-button { display: flex; gap: 9px; align-items: center; height: 43px; border: 1px solid #243229; padding: 0 10px 0 12px; border-radius: 5px; background: #29382d; color: #f7fbf3; font-weight: 700; font-size: 14px; box-shadow: 0 3px 7px #283c2e24; }
.build-button:hover, .build-button[aria-expanded=true] { background: #3b4e40; }
.build-button .icon { color: #d7edb5; }
kbd { display: inline-grid; min-width: 19px; height: 19px; padding: 0 4px; place-items: center; border: 1px solid #a5afa1; border-radius: 3px; font: 600 10px var(--mono); }
.build-button kbd { margin-left: 9px; color: #dae5d9; border-color: #637566; }
.asset-count, .coordinates { color: #5d6a5d; font: 600 10px var(--mono); white-space: nowrap; letter-spacing: .05em; }
.nav-controls { display: flex; align-items: center; gap: 12px; }
.zoom-group { display: flex; align-items: center; gap: 0; padding: 2px; background: #f9faf6; border: 1px solid #ccd4c8; border-radius: 5px; box-shadow: 0 2px 5px #283c2e12; }
.zoom-group .icon-button { border: 0; background: transparent; width: 30px; height: 33px; }
.zoom-group .icon-button:hover { background: #e9eee3; }
.zoom-group .icon { width: 16px; height: 16px; }
.zoom-group .recenter { border-left: 1px solid var(--line); padding-inline: 5px 0; width: 35px; border-radius: 0 3px 3px 0; }
#zoom-value { width: 40px; text-align: center; font: 600 10px var(--mono); }
.panel {
  position: absolute; z-index: 7; color: var(--ink); width: min(326px, calc(100% - 32px)); max-height: calc(100% - 157px); overflow: auto;
  border: 1px solid #c9d1c5; border-radius: 7px; background: #fafbf7; box-shadow: 0 16px 35px #39473523, 0 2px 5px #39473516;
  animation: appear .16s ease-out both;
}
@keyframes appear { from { opacity: 0; translate: 0 5px; } to { opacity: 1; translate: 0 0; } }
#panel { right: 28px; top: clamp(100px, 24vh, 215px); max-height: min(calc(100% - 165px), calc(100% - clamp(100px, 24vh, 215px) - 77px)); }
.panel-head { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; min-height: 45px; border-bottom: 1px solid #dde2d8; background: #f1f4ed; }
.panel-head .icon-button { width: 25px; height: 25px; background: transparent; border-color: transparent; }
.panel-head .icon-button:hover { background: #e2e9dd; }
.panel-head .icon { width: 15px; height: 15px; }
.eyebrow { display: flex; align-items: center; gap: 7px; color: #58655b; letter-spacing: .13em; font: 600 10px var(--mono); text-transform: uppercase; }
.eyebrow i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent, #79965b); }
.panel-body { padding: 17px; }
.panel h1, .panel h2, .panel h3 { margin: 0; line-height: 1.08; letter-spacing: -.045em; }
.panel h1, .panel h2 { font-size: 23px; font-weight: 770; }
.panel p { margin: 8px 0 14px; color: #56625a; font-size: 13px; line-height: 1.5; }
.panel .section-label { color: #536158; font: 600 10px var(--mono); letter-spacing: .08em; }
.stat-row { display: flex; flex-wrap: wrap; gap: 10px 12px; margin: 13px 0; padding: 10px 0; border-block: 1px solid #e1e6dc; }
.stat { flex: 1 0 62px; }
.stat span { display: block; }
.stat span:last-child { margin-top: 4px; font: 650 15px var(--mono); }
.timing { position: relative; height: 25px; margin: 7px 0 0; border: 1px solid #c7d0c0; border-radius: 4px; background: #e9eee4; overflow: hidden; }
.timing::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9.75%, #c9d3c234 9.75% 10%); }
.good-zone, .perfect-zone { position: absolute; inset-block: 0; }
.good-zone { background: #dbe7b7; border-inline: 1px solid #bacb85; }
.perfect-zone { background: #b9d875; border-inline: 1px solid #90ad4e; }
.timing-cursor { position: absolute; width: 3px; inset-block: 0; background: #263a28; transform: translateX(-50%); box-shadow: 0 0 0 1px #f4faee77; }
.timing-scale { display: flex; justify-content: space-between; gap: 3px; margin: 6px 0 10px; color: #627064; font: 500 10px var(--mono); }
.timing-scale span:nth-child(2) { color: #526e33; }
.action {
  display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; border: 1px solid #a6be7e; border-radius: 4px; padding: 7px 10px;
  color: #263225; background: #dceabf; font-size: 13px; font-weight: 750;
}
.action:hover, .action:focus-visible { background: #cde1a5; }
.action:active { transform: translateY(1px); }
.action:disabled { opacity: .57; transform: none; background: #e8ede1; border-color: #ccd5c4; }
.action.alt { background: #f5f7f0; border-color: #ccd5c4; }
.action.alt:hover:not(:disabled) { background: #e6ecde; }
.action.danger { background: #faf0eb; border-color: #dec1b6; color: #943c25; }
.action.danger:hover { background: #f1ded3; }
.action.full { width: 100%; justify-content: space-between; padding-inline: 10px; }
.action .icon { width: 16px; height: 16px; }
.action > span:first-child { display: inline-flex; align-items: center; gap: 7px; }
.action-cost { font: 600 11px var(--mono); }
.inline-status { min-height: 16px; margin-top: 7px; color: #57675a; font: 500 10px var(--mono); }
.storage-meter { border-radius: 3px; background: #e5eadf; height: 9px; overflow: hidden; margin-bottom: 11px; }
.storage-meter > i { display: block; height: 100%; width: 0; background: #86a950; transition: width .18s; }
.heat-meter { position: relative; height: 9px; margin: 7px 0 2px; border-radius: 3px; background: #e5eadf; overflow: hidden; }

<script>
/* The Library. Every page has three depths: a line, a paragraph, and the
   full detail with the numbers in it. Nothing below the line is shown unless
   it is asked for. Machines are keyed by their type and technologies share
   a page per branch. The science is the commonly quoted textbook version and
   has not been checked by a specialist. */
const LIBRARY = {
  real: {group: "The basics", title: "What is real here and what is not",
    short: "The machines are invented. The physics behind them is not.",
    how: "No machine splits atoms one at a time for profit, and the calibration bar is there to give your hands something to do. What is real is the chain of ideas: a heavy nucleus releases energy when it splits, the energy arrives as heat, heat becomes electricity, and electricity must be stored or sold at once. Every page here says which part is the game and which is the world.",
    deep: "There are three depths, and you choose how far to go. The line you see when you point at something is the short version. 'How it works' is a paragraph. 'The full detail' is the version with numbers, written to be correct rather than quick. Where a figure is given it is the commonly quoted textbook value, rounded. Real engineering has more caveats than fit here: a figure such as 200 MeV per fission is an average over many possible ways a nucleus can split, and a reactor's efficiency depends on its design. If something here matters to you, treat it as a starting point and check it against a physics textbook or the published material from bodies such as the IAEA or the World Nuclear Association. Nothing in the Library is needed to play. It is here because the real thing is more interesting than the game version of it."},
  power: {group: "The basics", title: "Energy and power",
    short: "Output is how fast. Electricity in storage is how much.",
    how: "The top bar keeps two numbers apart on purpose. Output, in E a second, is power: the rate the plant is producing at. Electricity, in E, is energy: the amount sitting in storage. The exchange pays for energy, so a big output with nowhere to put it earns nothing. Real grids keep the same distinction, with watts for power and joules or kilowatt hours for energy.",
    deep: "The joule is small. Lifting an apple one metre takes about one joule. A kettle is about 2,000 watts, so it uses 2,000 joules every second and around 360,000 joules to boil a litre of water in three minutes. Electricity bills use the kilowatt hour instead, which is the energy of one kilowatt running for one hour: 1,000 watts times 3,600 seconds, or 3.6 MJ. A large nuclear power station delivers about 1 gigawatt of electrical power, a thousand million watts, which is 3,600,000 MJ every hour. Mixing the two units up is the most common mistake in writing about energy: a battery described as '100 megawatts' has told you how fast it can discharge but not for how long. You need its megawatt hours for that. The prefixes go up in thousands: kilo, mega, giga, tera."},
  steam: {group: "The basics", title: "Turning heat into electricity",
    short: "A reactor makes heat. Steam and a turbine do the rest.",
    how: "The game skips a step and treats a reactor's output as electricity. A real station uses its heat to boil water into high pressure steam, the steam spins a turbine, the turbine turns a generator, and the used steam is cooled back into water to go round again. Only about a third of the heat ends up as electricity. The rest has to be thrown away, which is what the cooling towers are for.",
    deep: "This loop is called the Rankine cycle. There is a hard limit on how much of the heat any engine can turn into work, found by Sadi Carnot in 1824: the best possible efficiency is 1 minus the cold temperature divided by the hot temperature, both measured in kelvin. Steam from a pressurised water reactor is at about 285 degrees Celsius, or 558 kelvin, and the condenser is at about 30 degrees Celsius, or 303 kelvin, so the limit is about 46 per cent. Real machines lose more to friction and to heat flowing across temperature differences, and such a plant achieves about 33 per cent. Coal and gas plants run hotter and reach 40 to 60 per cent. The generator works by electromagnetic induction, discovered by Michael Faraday in 1831: moving a magnet past a coil of wire pushes charge around the coil. Almost all the world's electricity, whether from coal, gas, nuclear, hydro or wind, is made by spinning a magnet inside coils. Solar panels are the main exception."},
  balance: {group: "The basics", title: "Keeping the grid in balance",
    short: "Supply has to equal demand every second.",
    how: "Standing orders and automatic exports sell a steady trickle so storage never quite fills. The real reason anyone buys a steady trickle is that a grid cannot hold electricity: what goes in must come out in the same instant. A grid operator pays for power that turns up when promised, and pays more for power that can change quickly.",
    deep: "Mains electricity is alternating current: in Europe it reverses direction 50 times a second, in North America 60. That frequency is set by the spinning generators, which are all locked in step across the network. If demand exceeds supply, more energy is being taken from the generators than is being put in, so they slow down and the frequency falls. Too much supply and it rises. Operators hold it within a fraction of a hertz of the target, because much equipment is built around it and large generators disconnect to protect themselves if it drifts far. To manage this they pay for services beyond bulk energy: reserve that can start within minutes, fast response from batteries within a second, and stations able to restart a dead network with no outside power, known as black start. The heavy spinning mass of large turbines also resists sudden change, a property called inertia, which gives the operator a few seconds to react."},
  radiation: {group: "The basics", title: "Radiation",
    short: "What is left after fission is unstable, and says so.",
    how: "Nothing in the game is radioactive in a way that affects play. In reality the fragments left after fission are unstable and give off radiation as they settle into stable forms. There are a few kinds, they differ enormously in how far they travel and what stops them, and most of the engineering in a real station exists to keep them inside it.",
    deep: "Alpha particles are helium nuclei: heavy, charged, and stopped by a sheet of paper or the outer layer of skin, though harmful if the source gets inside the body. Beta particles are fast electrons, stopped by a few millimetres of aluminium. Gamma rays are high energy light, and need centimetres of lead or a metre or more of concrete to reduce them substantially. Neutrons carry no charge and are best slowed and absorbed by materials rich in light atoms, such as water or concrete. Dose is measured in sieverts, which account for the damage done to living tissue. Everyone receives natural background radiation from rocks, radon gas, cosmic rays and their own food: typically 2 to 3 millisieverts a year, varying several fold with where you live. A chest X-ray is about 0.02 to 0.1 millisieverts. Each radioactive substance has a half life, the time for half of it to decay: seconds for some fission products, 30 years for caesium-137, 24,000 years for plutonium-239. Short half lives mean intense radiation that fades quickly. Long ones mean weak radiation that lasts."},
  manual: {group: "Machines", title: "Manual atom splitter",
    short: "Makes electricity when you fire it. Better timing, more electricity.",
    how: "A marker sweeps the calibration bar and you fire as it crosses the centre: 1 E for a miss, 3 for a good split, 5 for a perfect one, before upgrades. The bar is invented so the first minutes are something to play. The idea behind it is fission: the nucleus of a heavy atom such as uranium-235 splits into two smaller ones and releases a great deal of energy for its size.",
    deep: "A uranium-235 nucleus has 92 protons and 143 neutrons. When it absorbs a slow neutron it becomes uranium-236 in an excited state, wobbles like a drop of liquid, and usually splits into two unequal fragments, for example barium and krypton, plus two or three free neutrons. About 200 million electron volts are released each time, most of it as the motion of the fragments, which stop within a fraction of a millimetre and turn that motion into heat. 200 MeV is only about 3.2 hundred-billionths of a joule (3.2e-11 J), so one fission is tiny. But a gram of uranium-235 contains about 2.6e21 atoms, and splitting all of them would release about 80,000 MJ, roughly the energy from burning three tonnes of coal. The energy comes from the mass difference through E = mc squared: the products are about 0.1 per cent lighter than what went in. Chemical reactions only rearrange electrons and release a few electron volts per atom, which is why nuclear fuel holds millions of times more energy per kilogram than anything you can burn."},
  battery: {group: "Machines", title: "Electricity storage",
    short: "Holds electricity until it is sold. When it is full, production stops.",
    how: "Storage makes nothing. It decides how long the plant can run before production is wasted, and how long you can wait for a better price. Every bank on a floor adds to one shared total, and each floor has its own. Real electricity has the same problem: it must be used the instant it is made unless something stores it, and storing it is expensive.",
    deep: "A battery stores energy in chemistry. In a lithium ion cell, charging pulls lithium ions out of a metal oxide and lodges them between layers of graphite. Discharging lets them return, and because the electrons that go with them cannot pass through the electrolyte, they are forced round the outside circuit, which is the current you use. Grid batteries are thousands of such cells in shipping containers with cooling and control electronics. They respond in a fraction of a second, which makes them excellent for steadying frequency, and they return about 85 to 95 per cent of the energy put in. Their weakness is duration: most installations can deliver their full power for one to four hours. Storing a windless winter week is a different problem entirely, and candidates for that include pumped hydro, hydrogen made by splitting water, compressed air in caverns and heat stored in molten salt. Batteries wear with each cycle as side reactions use up lithium, so their capacity fades over thousands of cycles."},
  exchange: {group: "Machines", title: "Electricity exchange",
    short: "Sells stored electricity for Flux at the price of the moment.",
    how: "The price drifts up and down around an average, so a high price will not last and neither will a low one. The chart shows the last minute. Standing orders sell a little automatically at a discount; researching Automated selling removes the discount, and later technologies raise how much can be exported each second. Each floor has its own exchange and its own price.",
    deep: "In most real wholesale markets generators offer power for each half hour or hour of the following day, and the grid operator accepts the cheapest offers first until demand is met. This is called the merit order. The price everyone receives is set by the most expensive station that was needed, so when demand is low only cheap sources run and the price is low, and when demand peaks an expensive gas plant sets the price for all. Wind and solar have almost no running cost, so on a windy sunny day they can push prices close to zero or even below it, meaning generators pay to stay connected. Nuclear stations are expensive to build but cheap to run, and slow to turn up and down, so they tend to run flat out and take whatever the price is. The same mathematics is used for interest rates and for the speed of a particle being jostled in a fluid."},
  auto: {group: "Machines", title: "Automatic atom splitter",
    short: "Does what the manual splitter does, steadily, without you.",
    how: "Each one makes 1.55 E a second before upgrades and technologies, and its two upgrades lift that without using another slot. Slots are the scarce thing: a floor starts with two and technologies add more. The machine itself is invented. Nothing real splits atoms one at a time on demand, and the full detail explains why not.",
    deep: "No real device splits individual atoms on demand to make useful power, and it is worth knowing why. To split a nucleus you must hit it with a neutron, and free neutrons are not available from a tap: outside a nucleus a neutron decays with a half life of about ten minutes. Particle accelerators can make them by smashing protons into heavy metal targets, a process called spallation, but an accelerator uses far more energy than the fissions it triggers release, unless those fissions go on to cause others. That is exactly what a chain reaction is, and it is why every real nuclear power source is a reactor and not a splitter. Designs called accelerator driven systems do combine the two: a subcritical core that cannot sustain itself, kept running by an accelerator, which stops the moment the beam is switched off. None has been built at power station scale."},
  lab: {group: "Machines", title: "Research laboratory",
    short: "Researches technologies for the whole plant. More labs, faster research.",
    how: "A project costs Flux to start and then takes time. Every laboratory on every floor works in one research network. On each floor a second laboratory adds 15 per cent, a third a little less, and the best-equipped lab there adds a bonus for that floor; the network adds the floors together, so the first lab on a new floor adds the most. Three labs in the network can run two projects at once and six can run three, sharing the speed equally. Technologies, once finished, count on every floor.",
    deep: "Most of what is known about reactors was learned in laboratories long before any power station was built, and the working method has not changed: measure, compare with prediction, and find out why they differ. The properties that matter most are cross sections, which describe how likely a nucleus is to capture or be split by a neutron of a given speed. They cannot be calculated well from first principles, so they are measured, isotope by isotope and energy by energy, and collected in large public data libraries used by every reactor designer in the world. Materials are tested by putting samples inside research reactors for years to see how radiation changes them: steel becomes brittle, graphite swells and shrinks, fuel cracks. A typical analysis laboratory would hold mass spectrometers, which sort atoms by mass and can tell uranium-235 from uranium-238, and gamma spectrometers, which identify radioactive substances from the exact energies of the rays they emit, each isotope having its own fingerprint."},
  isotope: {group: "Machines", title: "Isotope laboratory",
    short: "Spends electricity on isotopes, to sell or keep.",
    how: "A laboratory makes one isotope at a time in batches. While it works it draws a steady amount of electricity from its own floor's storage, before anything is exported; a batch costs the same electricity however long it takes, and if storage runs short it slows down rather than stopping the plant. The isotopes go into one stock for the whole plant, shown under MATERIALS, where they can be kept or sold. Whether that beats selling the electricity depends on its price, on the floor, and above all on whether the plant makes more than it can export. In the game, electricity powers the equipment; it does not turn into matter.",
    deep: "Radioactive isotopes are atoms whose nuclei are unstable and settle by giving off radiation, each at its own rate, measured by the half-life: the time for half of any amount to decay. That rate decides what an isotope is good for. Carbon-14, with a half-life of about 5,700 years, is formed naturally in the upper atmosphere, taken up by living things and no longer replaced after death, which is what radiocarbon dating measures; as a label it lets chemists and biologists follow carbon through a reaction. Cobalt-60, about 5.3 years, gives off penetrating gamma rays and is used to sterilise medical supplies, in some radiotherapy and to inspect welds. Iodine-131, about 8 days, is used in medicine because the thyroid gathers iodine from the blood. Molybdenum-99, about 66 hours, matters for what it becomes: technetium-99m, the isotope behind most nuclear medicine scans, with a half-life of only 6 hours. Because molybdenum-99 decays within days it cannot be stockpiled, so hospitals depend on a short chain of supply from a small number of facilities worldwide, and an outage at one of them is felt quickly. In the game none of them decay in stock; that is a simplification."},
  reactor: {group: "Machines", title: "Experimental reactor",
    short: "The first machine that keeps itself going.",
    how: "12 E a second from four tiles, nearly eight automatic splitters' worth, and 19 once it is refitted as the MK-II. A splitter has to be driven. A reactor does not: each fission releases neutrons that cause the next, so once started it sustains itself. That is why it makes so much more, and why everything after it is about carrying heat away.",
    deep: "The first reactor, Chicago Pile 1, ran on 2 December 1942 under the stand of a sports stadium. It was a stack of graphite blocks with lumps of uranium set into them, about 6 metres high, with no cooling and no shielding, and it was first run at half a watt. Everything since has the same parts. Fuel, usually pellets of uranium dioxide sealed in thin metal tubes. A moderator, which slows the neutrons so that they are far more likely to cause fission: water in most reactors, graphite or heavy water in others. Control rods of a material that swallows neutrons, such as boron or cadmium, pushed in to slow the reaction and pulled out to raise it. A coolant to carry the heat away, which in most designs is the same water as the moderator. This pairing has a useful consequence: if the water boils away or is lost, the moderation goes with it and the chain reaction falters. The most common design today, the pressurised water reactor, keeps its water at about 155 times atmospheric pressure so that it stays liquid at over 300 degrees Celsius."},
  tower: {group: "Machines", title: "Cooling tower",
    short: "Lowers the temperature nearby reactors settle at.",
    how: "A tower lowers the temperature every reactor within three tiles settles at: by 15 at MK-I, 25 at MK-II and 40 at MK-III. It changes where the temperature is heading, not where it is, so the reactor still takes most of a minute to get there. A second tower in range counts for half, a third for a quarter. A tower draws 1, 2 or 4 E a second from storage while a reactor is in range, and cools less if storage runs dry. Real cooling towers do the same job for a whole station: they carry away the two thirds of the heat that cannot be turned into electricity.",
    deep: "Nearly all the energy of fission appears as heat inside the fuel. A power reactor is a way of carrying that heat out fast enough: a coolant, usually water under high pressure, is pumped through the core and gives its heat to a second loop that makes steam. A typical large reactor produces about 3,000 megawatts of heat to deliver 1,000 megawatts of electricity. The awkward part is that the heat does not stop when the chain reaction does. The fission fragments left in the fuel are radioactive and keep releasing energy as they decay. Immediately after shutdown this decay heat is about 6 to 7 per cent of full power, about 1 per cent after a few hours, and it falls slowly from there. For a large reactor that is still tens of megawatts, enough to damage the fuel if cooling is lost, which is why real plants have several independent cooling systems and backup power for them."},
  commercial: {group: "Machines", title: "Small commercial reactor",
    short: "A reactor built to sell power, not to learn from.",
    how: "53 E a second, and 70 with high-flow cooling. It can only be built once an experimental reactor is running, because nobody builds the commercial version first. The step from a working experiment to a station that supplies a grid year after year took the real industry about fifteen years, and most of that was engineering, not physics.",
    deep: "Going from an experiment to a power station took about fifteen years. Calder Hall in England began supplying the grid in 1956 and Shippingport in the United States in 1957, at about 60 megawatts per reactor. Modern units deliver 1,000 to 1,650 megawatts of electricity from a core only about 4 metres across. The fuel is uranium enriched to between 3 and 5 per cent uranium-235. A large core holds around 100 tonnes of it, and a third is replaced every 18 to 24 months, so a station uses about 25 to 30 tonnes of fuel a year where a coal station of the same output burns about 3 million tonnes. The used fuel is intensely radioactive and is kept under water for some years while the short lived products decay, then stored in steel and concrete casks. The power density in the core is extreme, around 100 megawatts per cubic metre, which is why heat removal dominates the design. The whole primary system sits inside a containment building of steel lined concrete about a metre thick, there as the last of several barriers."},
  large: {group: "Machines", title: "Large commercial reactor",
    short: "Nine tiles, four cooling stacks.",
    how: "185 E a second, 245 with closed-loop cooling, from nine tiles. The four stacks are not chimneys. A station can only turn about a third of its heat into electricity and must get rid of the rest, and the white plume from a cooling tower is water vapour carrying that heat away. A bigger core means more heat to lose, so the towers grow with it.",
    deep: "A power station must throw away roughly two thirds of its heat, and a cooling tower is how most inland stations do it. Warm water from the condenser is sprayed over a packing inside the base of the tower. Air is drawn up through it, a small part of the water evaporates, and evaporation carries off a great deal of heat: about 2,260 kilojoules for every kilogram that evaporates, more than five times what it takes to heat that kilogram from freezing to boiling. The cooled water falls into a basin and is pumped back. The tall curved shape is a hyperboloid. Warm moist air inside is lighter than the air outside, so it rises and pulls fresh air in at the bottom with no fans needed, and the narrowing waist speeds the flow. The shape is also strong for its weight and can be built from straight steel bars. A large tower evaporates between half a tonne and a tonne of water every second. Stations on the coast usually skip towers and pass sea water through the condenser once, which is why so many nuclear stations are beside the sea. The towers themselves are not nuclear: coal and gas stations use identical ones."},
  advanced: {group: "Machines", title: "Advanced nuclear reactor",
    short: "The largest water-cooled station on the mainland.",
    how: "610 E a second from nine tiles, more than everything before it put together. It needs six technologies from six branches, because a station this size is a cooling problem, a storage problem and a grid problem as much as a nuclear one. Real designs of this generation differ from the last mostly in what happens when things go wrong.",
    deep: "The reactors being built now are the third generation of commercial designs, and the difference from the second is mostly about what happens when things go wrong. Earlier plants rely on pumps and diesel generators to keep cooling the core after shutdown. Newer designs add passive systems that need no power and no operator: tanks of water placed above the core that drain into it by gravity, heat exchangers that carry decay heat away by natural circulation alone, and in some a core catcher, a basin beneath the vessel designed to spread and cool the fuel should it ever melt through. They are also larger, up to 1,650 megawatts of electricity from a single unit, burn their fuel more thoroughly, and are designed to run for sixty years. The fourth generation, still mostly on paper or in prototypes, changes the coolant itself: liquid sodium, molten salt, lead or helium in place of water, allowing higher temperatures and better use of the fuel. In reality each generation has been less about size than about making the worst case less bad."},
  tidal: {group: "Machines", title: "Tidal turbine",
    short: "Steady output from the tide. Only on Seren Atoll.",
    how: "32 E a second, 46 with variable-pitch blades, and it never needs fuel. It counts as a renewable machine, so reactor technologies do nothing for it and Tidal arrays does. A real tidal turbine is an underwater windmill. Water is far denser than air, so a slow current carries as much power as a gale, and unlike wind the tide can be predicted decades ahead.",
    deep: "Tides are caused by gravity pulling harder on the near side of the Earth than the far side. The Moon does most of it and the Sun about half as much again, which is why tides are largest when the two line up at new and full moon. Most coasts get two high tides every 24 hours and 50 minutes. A tidal turbine is an underwater windmill: water is about 800 times denser than air, so a slow current of two or three metres a second carries as much power as a gale. The oldest large scheme, at La Rance in France, has worked since 1966 by damming an estuary and letting the tide run through turbines in both directions, producing 240 megawatts at peak. Newer projects stand turbines on the sea bed in fast channels, such as the Pentland Firth off Scotland. The attraction is certainty: the times and heights of tides are known decades in advance. The difficulties are that the power arrives in pulses with a slack period between, that few places have currents fast enough, and that salt water, weed and barnacles are hard on machinery nobody can easily reach."},
  intake: {group: "Machines", title: "Seawater cooling loop",
    short: "Lifts every generator on its floor by a tenth. Only on Seren Atoll.",
    how: "It makes no electricity itself. Each loop multiplies the output of everything on Seren Atoll by 1.1, so two of them are worth 21 per cent. The real effect is the same in kind: the colder the water that condenses the used steam, the more of the heat a station can turn into electricity. That is why so many real stations stand on a coast.",
    deep: "The simplest way to cool a power station is to take cold water from the sea, pass it once through the condenser and return it a few degrees warmer. This is called once through cooling, and it needs no towers at all. The quantities are enormous: a large station draws 40 to 60 cubic metres of sea water every second, a small river's worth, through tunnels wide enough to drive a lorry down. The water never touches anything radioactive. It only cools the steam on the far side of the condenser tubes. Cold water gives a lower condenser temperature, which, by Carnot's limit, gives better efficiency, so a station on a cold coast makes slightly more electricity than the same station on a warm one. The costs are to sea life: fish and plankton are drawn in with the water, and the warm outflow changes what lives near it, so intakes are fitted with screens, slow velocities and sometimes sound barriers. Jellyfish are a recurring nuisance. Swarms have blocked the screens and shut down reactors in Scotland, Sweden and Japan."},
  floating: {group: "Machines", title: "Floating reactor",
    short: "A reactor on a hull, cooled by the lagoon. Only on Seren Atoll.",
    how: "215 E a second from four tiles, 300 with a second steam loop. It is the only reactor on the atoll, and it needs Floating plants first. Reactors on ships are older than reactors in power stations: the first reactor to power anything was in a submarine.",
    deep: "The first reactor to power anything was in a submarine, the USS Nautilus, in 1954, three years before the first commercial power station. A reactor suits a ship because it needs no air and refuels perhaps once in a decade or more. Several hundred naval reactors have since been built, along with a small fleet of Russian nuclear icebreakers. The floating power station follows from that. The Akademik Lomonosov is a barge 144 metres long carrying two small reactors, towed to the Arctic town of Pevek, where it has supplied about 70 megawatts of electricity and heat since 2019. The idea is that the plant is built in a shipyard, where the skills and cranes already are, and delivered complete to a place too remote for a construction site. The sea provides the cooling. The concerns are the ones you would expect: storms, collisions, sinking, and the difficulty of supervising a reactor that can be moved. Designers answer that a hull moored in a sheltered harbour is at least well placed for the one thing a reactor needs most in an emergency, which is water."},
  wind: {group: "Machines", title: "Wind turbine",
    short: "Output from the plateau wind. Only on Corran Plateau.",
    how: "78 E a second from a single tile, 112 with longer blades. A longer blade sweeps a bigger circle, and the power available grows with the area of that circle. It grows much faster still with the speed of the wind, which is why turbines are tall and why they are built where nothing slows the air down.",
    deep: "The power in wind rises with the cube of its speed: double the wind and there is eight times the power. That single fact explains most of wind energy. It is why turbines are put on hills and out at sea, why they are built so tall, since the wind is stronger higher up, and why their output swings so much from day to day. The power also rises with the area swept by the blades, so doubling the blade length gives four times the power. The largest offshore turbines now have blades over 100 metres long and produce around 15 megawatts each. There is a hard ceiling on what any turbine can extract, worked out by Albert Betz in 1919. To take all the energy from the wind you would have to stop the air dead, and then no more air could pass. The best compromise slows the wind to a third of its speed and captures 16/27 of its energy, about 59 per cent. Modern turbines manage 45 to 50. Thin air is a real cost at altitude: at 4,000 metres the air is about two thirds as dense, and so is the power."},
  solar: {group: "Machines", title: "Solar field",
    short: "Strong by day, weak by night. Only on Corran Plateau.",
    how: "250 E a second on average, but that is an average: output swings from well over that at noon to less than half of it at night, on a cycle of four minutes. Storage on the plateau has to carry the night. Sun trackers lift the average to 340. A panel has no moving parts: light knocks electrons loose in silicon and a built-in field pushes them round a circuit.",
    deep: "A solar cell is a thin slice of silicon made in two layers, one with a few atoms that give up electrons easily and one with a few that accept them. Where the layers meet there is a built-in electric field. When a particle of light with enough energy strikes the silicon it knocks an electron loose, the field pushes it one way and the gap it left the other, and that is a current. There is no moving part and nothing is used up. Sunlight above the atmosphere delivers about 1,360 watts on each square metre, and around 1,000 reaches the ground at noon on a clear day. A good commercial panel turns a little over 20 per cent of that into electricity; the limit for a single layer of silicon is about 29 per cent, because light with too little energy passes through and light with too much wastes the excess as heat. The harder limit is the sky. Averaged over day, night, cloud and season, a panel delivers roughly 10 to 25 per cent of its rated power, which is why solar power and storage are always discussed together. High, dry places do best: thinner air scatters less light and cold panels work more efficiently."},
  observatory: {group: "Machines", title: "Plateau observatory",
    short: "Speeds up research on its floor. Only on Corran Plateau.",
    how: "Each one multiplies research speed on Corran Plateau by 1.18, on top of the plateau's own quarter. It makes no electricity. High, dry sites are where real observatories are built, because there is less air and less water vapour between the instrument and what it is looking at. Some of what they detect is particles arriving from space with more energy than any machine on Earth can give.",
    deep: "The Earth is hit continuously by particles from space, mostly protons, some carrying far more energy than any accelerator can give. They were discovered in 1912 by Victor Hess, who took an electrometer up in a balloon and found that radiation increased with height instead of falling away from the ground as everyone expected. When one strikes the upper atmosphere it shatters a nucleus and starts a cascade, called an air shower, of millions of secondary particles spread over several square kilometres by the time it reaches the ground. Many of those that arrive are muons, heavy cousins of the electron. About one passes through every square centimetre of you each minute. Muons should decay long before reaching the ground, and the fact that they do not is one of the plainest demonstrations of relativity: moving near the speed of light, their clocks run slow. Observatories are built high up to catch showers before the air absorbs them. Cosmic rays matter to reactors too: they are part of the natural background dose, which roughly doubles for every 1,500 metres you climb, and they are why sensitive measurements are made deep underground."},
  gas: {group: "Machines", title: "Gas-cooled reactor",
    short: "Cooled by helium, so it needs no water. Only on Corran Plateau.",
    how: "1,150 E a second from nine tiles, and 1,500 when the outlet temperature is raised: the largest station in the game. It is the last thing in the Expansion branch. Water is a good coolant with one awkward habit, which is that it boils. A gas does not, so a gas-cooled core can run far hotter, and hotter heat turns into electricity more efficiently.",
    deep: "Water is a good coolant with one awkward habit: it boils. To keep it liquid at 300 degrees Celsius a reactor must hold it at 155 times atmospheric pressure, and losing that pressure is the start of most serious accident sequences. A gas has no such problem. Helium does not boil, does not react chemically with anything, and does not become radioactive, so it can carry heat out of a core at 750 degrees or more. Higher temperature means higher efficiency, by Carnot's limit: around 45 per cent, against 33 for water cooled plants. The fuel in such reactors is made as tiny particles, each a grain of uranium wrapped in layers of carbon and silicon carbide that hold in the fission products up to about 1,600 degrees. The core is mostly graphite, which soaks up heat slowly, so that if all cooling is lost the reactor warms, the chain reaction fades by itself, and the heat leaks away through the walls without the fuel reaching a damaging temperature. Britain ran a fleet of carbon dioxide cooled reactors for decades. China connected a helium cooled plant of this kind, the HTR-PM, to its grid in 2021."},
  branch0: {group: "Technology", title: "Atomic physics",
    short: "Makes each timed split worth more and easier to hit.",
    how: "This branch improves the manual splitter: more electricity for each split, wider targets on the calibration bar, and at the far end a tenth more from every generator. The real subject is what makes a nucleus split at all. The surprising part is that slow neutrons do it far better than fast ones.",
    deep: "A neutron from fission carries about 2 million electron volts and travels at roughly 20,000 kilometres a second. A neutron in step with the warmth of its surroundings, called a thermal neutron, has about 0.025 electron volts and moves at about 2.2 kilometres a second. For uranium-235 the chance of fission, expressed as an area called a cross section, is around 1 barn for the fast neutron and about 585 barns for the thermal one. A moderator slows neutrons by letting them bounce off light nuclei, in the way a snooker ball loses most of its speed hitting another ball but almost none hitting a bowling ball. Hydrogen is best at slowing, taking about 18 collisions, but it sometimes absorbs the neutron. Deuterium needs about 25 collisions and carbon about 115, but both absorb far less, which is why heavy water and graphite reactors can run on natural uranium while ordinary water reactors need enriched fuel."},
  branch1: {group: "Technology", title: "Nuclear physics",
    short: "The reactors, one after another.",
    how: "Every reactor is unlocked here, and each needs the one before it to be standing first. Notice how much of the groundwork comes from other branches: cooling, storage, the grid. The physics of a chain reaction was understood within a few years. Building a station around it took decades.",
    deep: "The key number is the multiplication factor, written k: the average number of neutrons from one fission that go on to cause another. If k is below 1 the reaction dies away, and the assembly is subcritical. If k is exactly 1 the rate is steady, which is critical, and despite how the word sounds in everyday speech this is the normal, intended state of a running power reactor. If k is above 1 the rate grows, which is supercritical, and is how power is raised. Neutrons can be lost by escaping from the surface or by being absorbed without causing fission, so a lump of fuel that is too small leaks too many. The smallest amount that can sustain a chain reaction for a given material, shape and surroundings is its critical mass. What makes a reactor controllable is that about 0.65 per cent of the neutrons from uranium-235 are not released at once. These delayed neutrons arrive seconds to a minute later, from the decay of fission fragments, and they slow the response of the whole reaction from thousandths of a second to something control rods and operators can follow."},
  branch2: {group: "Technology", title: "Electrical engineering",
    short: "Moves more power off the floor and gets more from each machine.",
    how: "Switchgear and load balancing lift the automatic splitters; grid synchronisation and the interconnect raise how much the exchange can export each second. A plant that makes more than it can export just fills its storage. On a real grid the same limit exists, and the answer is high voltage: the losses in a wire fall sharply as the voltage rises.",
    deep: "Wires resist the flow of current and turn some of the energy into heat. The power lost is the current squared times the resistance, so halving the current cuts the loss to a quarter. Power is voltage times current, so the same power can be sent as a small current at a high voltage. That is the whole reason for the pylons of a national grid: power leaves a station at around 25,000 volts, is stepped up to 275,000 or 400,000 volts for the journey, and is stepped down in stages to the 230 volts in a European home. The device that does it is the transformer: two coils of wire around a shared iron core. Alternating current in the first coil makes a changing magnetic field in the core, which induces a voltage in the second, in proportion to the number of turns on each. It has no moving parts and wastes about 1 per cent. Transformers only work with alternating current, which is the main reason the world's grids are AC. In total a well run grid loses 5 to 8 per cent of what is generated between power station and plug."},
  branch3: {group: "Technology", title: "Energy storage",
    short: "More capacity from every bank, and more banks.",
    how: "Each step multiplies the capacity of every storage bank on every floor and unlocks better equipment for them. Storage is what lets a plant ride out a low price, or a solar field ride out the night. A wire cannot hold electricity the way a pipe holds water, so every unit stored has been turned into something else and has to be turned back.",
    deep: "A wire cannot hold electricity the way a pipe holds water. On a real grid the power going in must equal the power coming out, second by second, so storage means converting electrical energy into another form and back. Capacitors hold it in an electric field: fast, but small, a few watt hours per kilogram. Lithium ion batteries hold it chemically at around 150 to 250 watt hours per kilogram and return about 85 to 95 per cent of what was put in. The largest stores in the world are not batteries at all but pumped hydro: water pumped up a hill when power is cheap and run back down through turbines when it is needed, returning about 70 to 80 per cent. When a real grid has more power than it can use or store, generators are told to turn down and the energy they could have made is simply lost."},
  branch4: {group: "Technology", title: "Thermal management",
    short: "Every step here lifts every reactor.",
    how: "Coolant controls, containment, high-flow cooling and thermal recirculation each add to reactor output, and each unlocks an upgrade for a particular station. In the game heat is never a danger, only a limit. In a real station getting the heat out safely is most of the design, and the first rule is that the water touching the core never leaves the building.",
    deep: "In a pressurised water reactor the water that passes through the core never leaves the reactor building. It flows through thousands of thin tubes inside a steam generator, and a second, separate body of water around those tubes boils to make the steam that drives the turbine. A large steam generator stands about 20 metres tall and contains several thousand tubes with walls about a millimetre thick, giving a total surface about the size of a football pitch. Heat flow through a wall is proportional to its area and to the temperature difference across it, and falls as the wall gets thicker, so the design is always a trade between thin walls for heat flow and thick walls for strength. Arranging the two fluids to flow in opposite directions, called counterflow, keeps a temperature difference along the whole length and extracts the most heat. The same principle is in a car radiator, a refrigerator, and the blood vessels in a penguin's feet."},
  branch5: {group: "Technology", title: "Industrial infrastructure",
    short: "More slots, and faster research.",
    how: "This branch adds slots for automatic splitters and laboratories and speeds up research. Slots are the real constraint on a floor, so these are worth more than they look. The real measure of an industrial plant is not its peak output but how much of the year it actually runs.",
    deep: "Engineers measure this with the capacity factor: the energy a plant actually delivered divided by what it would have delivered running flat out all year. Nuclear stations in several countries now average about 90 per cent, up from around 60 per cent in the 1970s. Almost none of that gain came from new physics. It came from shorter refuelling stops, planned maintenance, standardised parts and learning from every unplanned shutdown anywhere in the industry. Standard, interchangeable parts are one of the oldest ideas in manufacturing, going back to musket locks around 1800, and the reason is the same now as then: if every part fits every machine, repair becomes replacement. The same thinking lies behind small modular reactors, intended to be built as identical units in a factory and delivered by road, in the hope that the hundredth one is cheaper and better than the first."},
  branch6: {group: "Technology", title: "Commercial operations",
    short: "A better price for everything sold.",
    how: "Three of the four add 8 per cent to every sale, automatic or not, and the later ones raise the export limit. It compounds with the exchange's own equipment. Most real electricity is not sold on the open market at the price of the moment. It is sold months or years ahead, because both sides would sooner have certainty.",
    deep: "Most electricity is not sold on the day ahead market at all. It is sold months or years in advance through direct agreements, because both sides want certainty. A power station costs billions to build and its owner needs to know it will earn enough to repay the loan. A steelworks or a data centre needs to know what its power will cost. So they agree a price for a volume over a period, and the fluctuating market handles only the difference between what was contracted and what actually happened. Nuclear stations rely on this more than most. Almost all their cost is in construction, before a single unit is sold, so the price they need depends heavily on the interest rate on that borrowing. Some governments now offer what is called a contract for difference: the station is guaranteed a fixed price, receiving a top up when the market is below it and paying back when the market is above it."},
  branch7: {group: "Technology", title: "Automation",
    short: "Sells for you, and lifts the automatic splitters.",
    how: "Automated selling removes the discount on standing orders and starts real exports; dispatch control raises the limit; the rest lift the automatic splitters and add slots. The tool underneath all automatic control is feedback: measure something, compare it with what you want, and act on the difference.",
    deep: "The basic tool of automatic control is feedback: measure something, compare it with what you want, and act on the difference. A thermostat does this crudely, switching fully on or off. Industrial plant uses a controller with three parts. The proportional part pushes harder the further the value is from the target. The integral part adds up any error that persists and leans against it, removing steady offsets. The derivative part reacts to how fast the error is changing, damping overshoot. This is the PID controller, about a century old and still running most of the world's process plant. In a reactor, layers of such loops hold pressure, water level and power. They are kept strictly separate from the protection system, which does only one thing: shut the reactor down if any measurement leaves its safe range. That system has three or four independent channels and acts when two of them agree, so that one faulty sensor can neither cause a shutdown nor prevent one."},
  branch8: {group: "Technology", title: "Expansion",
    short: "Opens other plant floors, each with its own machines.",
    how: "Offshore engineering opens Seren Atoll and High-altitude engineering opens Corran Plateau. Flux and technologies are shared between floors; storage, machines and the price are not. Every other open floor lifts output everywhere by a tenth. Real grids are tied together for the same reason: the weather, the price and the demand are different somewhere else.",
    deep: "Electricity prices differ from place to place, because the weather, the mix of power stations and the time of day all differ. An interconnector is a high capacity link between two grids that lets power flow from the cheaper side to the dearer one, which evens the prices out and lets each side lean on the other in a shortage. Over long distances, and always under the sea, these links use direct current at very high voltage instead of the alternating current of the grids themselves. A long cable behaves like a capacitor, and with alternating current it must be charged and discharged fifty times a second, which over more than a few tens of kilometres under water uses up the cable's capacity before much useful power gets through. Direct current has no such loss. It also lets two grids trade without having to keep their frequencies in step. At each end a converter station covering several football pitches turns one kind of current into the other using stacks of power electronics. Links of this kind now run for hundreds of kilometres: the cable between Norway and Britain is about 720 kilometres long and carries 1,400 megawatts."}
};

  settingsMenu.innerHTML = heading('Plant controls') + '<div class="panel-body"><h2>Settings</h2><label>Volume <input id="volume" aria-label="Volume" type="range" min="0" max="1" step=".01" value="' +
