    '<hr><span class="section-label">PROGRESS</span><p>' + (onWeb ? 'Progress stays in this browser.' : 'Progress stays in this browser. Export a save to move it to another device or the offline version.') + '</p>' +
    '<div class="settings-row">' + action('Save now', 'save') + (onWeb ? '' : action('Export save', 'export', {type: 'alt'})) + action('Import save', 'import', {type: 'alt'}) + '</div>' +
    (onWeb ? '' : '<div class="settings-row">' + action('Download game HTML', 'download-game', {type: 'alt'}) + '</div>') + '<div class="settings-row">' + (resetting ?
      action('Confirm reset', 'reset-confirm', {type: 'danger'}) + action('Keep progress', 'reset-cancel', {type: 'alt'}) :
      action('Reset progress', 'reset', {type: 'danger'})) + '</div>' +
    (resetting ? '<p>Confirming replaces this browser’s current plant.</p>' : '') +
    '<hr><span class="section-label">LOOK AT A PLANT</span><p>A ready-made plant at three points in the game. Your own is not touched.</p>' +
    '<div class="settings-row">' + STAGES.map(stage => '<a class="action alt" href="' + stageLink(stage) + '">' + stage[0].toUpperCase() + stage.slice(1) + '</a>').join('') + '</div>' +
    (guideLink ? '<hr><span class="section-label">WHAT’S NEW</span><p>Everything added in versions 1.9 and 2.0, explained.</p>' +
      '<div class="settings-row"><a class="action alt" href="' + guideLink + '">What’s new in 2.0 and 1.9</a></div>' : '') +
    '<hr><span class="section-label">LOCATE ON MAP</span><div class="map-index">' +
    [...buttons.values()].map(b => action(MACHINES[b.type].tag, 'find-' + b.id, {type: 'alt'})).join('') + '</div></div>';
  $('volume').addEventListener('input', e => { state.settings.volume = Number(e.target.value); });
  $('volume').addEventListener('change', () => { sound('ui'); saveGame(); });
  $('mute').addEventListener('change', e => { state.settings.mute = e.target.checked; sound('ui'); saveGame(); });
}
function buttonAction(e) {
  const button = e.target.closest('button[data-action]');
  if (!button || button.disabled) return;
  const key = button.dataset.action;
  if (key === 'close') { closeAll(); sound('ui'); }
  else if (key === 'split') splitAtom();
  else if (key === 'programme-complete') completeProgrammeStage();
  else if (key.startsWith('isotope-')) isotopeAction(key.slice(8));
  else if (key.startsWith('materials-sell-')) sellMaterial(key.slice(15));
  else if (key === 'programme-open') openProgramme();
  else if (key === 'programme-tracker') { game.settings.tracker = game.settings.tracker === false; trackerSignature = ''; updateProgramme(); saveGame(); }
  else if (key === 'reactor-controller' || key === 'reactor-auto') {
    const b = state.buildings.find(item => item.id === selectedId);
    if (b && (key === 'reactor-controller' ? buyController(state, b) : setReactorAuto(b, !b.auto))) {
      sound(key === 'reactor-controller' ? 'buy' : 'ui'); updateMachine(); saveGame();
    }
  } else if (key.startsWith('reactor-mode-')) {
    const b = state.buildings.find(item => item.id === selectedId);
    if (b && setReactorMode(b, key.slice(13))) { sound('ui'); updateMachine(); saveGame(); }
  }
  else if (key === 'lab-tab-tree' || key === 'lab-tab-ventures') {
    labTab = key.slice(8); techSignature = ''; ventureSignature = ''; renderTech(); sound('ui');
  } else if (key === 'venture-result') showVentureResult();
  else if (key === 'venture-collect') collectVenture();
  else if (key.startsWith('venture-') && Object.hasOwn(VENTURES.kinds, key.slice(8))) {
    if (startVenture(game, key.slice(8))) { sound('buy'); ventureSignature = ''; renderTech(); saveGame(); }
  }
  else if (key.startsWith('sell-')) sell(Number(key.slice(5)));
  else if (key.startsWith('place-')) beginPlacement(key.slice(6));
  else if (key === 'auto-sale') {
    state.autoSell = !state.autoSell; sound('ui'); saveGame();
    openMachine(selectedId, false);
  } else if (key === 'reactor-restart') {
    const b = state.buildings.find(item => item.id === selectedId);
    if (b && restartReactor(b)) {
      pop(b, 'RESTARTED', '#548044', 10);
      sound('ui'); updateMachine(); saveGame();
    }
  } else if (key === 'upgrade') {
    const b = state.buildings.find(item => item.id === selectedId);
    if (b && upgradeBuilding(state, b)) {
      pop(b, b.type === 'reactor' ? 'MK-II ONLINE' : 'UPGRADED', '#548044', 16);
      sound('buy');
      if (b.type === 'lab') renderTech();
      else renderMachine(b);
      saveGame();
    }
  } else if (key === 'dismantle' || key === 'dismantle-cancel') {
    const b = state.buildings.find(item => item.id === selectedId);
    if (b && MACHINES[b.type].cost) {
      pendingDismantle = key === 'dismantle' ? b.id : null;
      const prefix = b.type === 'lab' ? 'lab-' : '';
      updateDismantle(b, prefix);
      $(prefix + 'dismantle-primary').focus();
    }
  } else if (key === 'dismantle-confirm' && pendingDismantle !== null && pendingDismantle === selectedId) {
    const b = state.buildings.find(item => item.id === selectedId);
    const refund = dismantleBuilding(state, selectedId);
    if (refund) {
      occupancy = occupied(state.buildings);
      builtAt.delete(b.id);
      tagButtons.get(b.id)?.remove();
      tagButtons.delete(b.id);
      closeAll();
      toast('Dismantled ' + machineName(b) + ' · ' + money(refund.amount) + ' refunded');
      saveGame();
    }
  } else if (key.startsWith('tech-')) {
    techSelected = key.slice(5); renderTech(); sound('ui');
  } else if (key === 'start-research') {
    if (startResearch(state, techSelected)) { renderTech(); sound('ui'); saveGame(); }
  } else if (key === 'save') saveGame(true);
  else if (key === 'export') exportSave();
  else if (key === 'import') $('save-input').click();
  else if (key === 'download-game') exportGame();
  else if (key.startsWith('read-')) openPage(key.slice(5));
  else if (key.startsWith('filter-')) { discoveryFilter = key.slice(7); renderDiscoveries(); sound('ui'); }
  else if (key === 'library') openLibrary();
  else if (key === 'deeper') {
    readerDepth++; noteRead(readerKey, readerDepth); renderPage(); sound('ui');
  }
  else if (key === 'legacy-begin' || key === 'legacy-cancel') { legacyConfirming = key === 'legacy-begin'; renderLegacy(); }
  else if (key === 'legacy-confirm') {
    const gained = beginAgain(game);
    if (gained) {
      for (const id of Object.keys(cameras)) delete cameras[id];
      techSelected = 'atomic';
      showWorld('mainland'); saveGame();
      sound('research'); toast('Began again · +' + gained + ' legacy point' + (gained === 1 ? '' : 's') + ' · ' + percent(legacyBonus(game)) + ' for good');
      openMachine(1, false);
    }
  } else if (key.startsWith('perk-')) {
    if (buyPerk(game, key.slice(5))) { sound('buy'); saveGame(); renderLegacy(); }
  }
  else if (key === 'reset') { resetting = true; renderSettings(); }
  else if (key === 'reset-cancel') { resetting = false; renderSettings(); }
  else if (key === 'reset-confirm') { restore(freshGame()); toast('New plant started'); }
  else if (key.startsWith('find-')) {
    const b = state.buildings.find(item => item.id === Number(key.slice(5)));
    if (b) {
      const half = MACHINES[b.type].size / 2;
      [camera.targetX, camera.targetY] = floorPoint(b.x + half, b.y + half, 22);
      openMachine(b.id);
    }
  }
}
surfaces.forEach(surface => surface.addEventListener('click', buttonAction));
$('venture-result').addEventListener('click', buttonAction);
$('programme-tracker').addEventListener('click', buttonAction);
/* The reactor power slider. Dragging changes the power at once; the
   temperature follows over the next minute. */
panel.addEventListener('input', e => {
  const b = state.buildings.find(item => item.id === selectedId);
  if (!b) return;
  if (e.target.id === 'control-target') { if (setReactorTarget(b, Number(e.target.value))) updateMachine(); return; }
  if (e.target.id !== 'reactor-power') return;
  // Moving the power by hand takes it back from the controller.
  if (b.auto) setReactorAuto(b, false);
  if (setReactorPower(b, Number(e.target.value) / 100)) updateMachine();
});
panel.addEventListener('change', e => {
  if (e.target.id === 'reactor-power' || e.target.id === 'control-target') { sound('ui'); saveGame(); }
});
function reactorShutDown(b, floor) {
  pop(floor === state ? b : null, 'SHUTDOWN', '#a14a2c', 12);
  toast(machineName(b) + (floor === state ? '' : ' on ' + WORLDS[floor.world].name) + ' shut down at ' +
    ECONOMY.reactorHeat.shutdown + '. Restart it below ' + ECONOMY.reactorHeat.restartBelow + '.');
  sound('ui'); saveGame();
}
$('build-button').addEventListener('click', openBuild);
$('settings-button').addEventListener('click', openSettings);
$('cancel-placement').addEventListener('click', cancelPlacement);
function zoomAtCenter(factor) { zoomBy(factor, ...center()); }
$('zoom-out').addEventListener('click', () => zoomAtCenter(1 / 1.22));
$('zoom-in').addEventListener('click', () => zoomAtCenter(1.22));
$('home-camera').addEventListener('click', () => resetCamera());
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (relocation) cancelRelocation();
    else if (placement) cancelPlacement();
    else closeAll();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.matches('input, textarea')) return;
  const key = e.key.toLowerCase();
  const manualOpen = !panel.hidden && selectedId === 1;
  if ((e.code === 'Space' || key === 'enter') && manualOpen && (!e.target.closest('button') || e.target.id === 'split-button' || (e.code === 'Space' && e.target.closest('.machine-tag.active')))) {
    e.preventDefault(); if (!e.repeat) splitAtom();
  }
  if (!e.repeat && key === 'b') { e.preventDefault(); openBuild(); }
  if (!e.repeat && key === 'tab' && Object.keys(game.worlds).length > 1) { e.preventDefault(); nextWorld(); }
  if (key === 'h') { e.preventDefault(); resetCamera(); }
  if (key === '+' || key === '=') { e.preventDefault(); zoomAtCenter(1.12); }
  if (key === '-') { e.preventDefault(); zoomAtCenter(1 / 1.12); }
  const direction = {arrowleft: [-1, 0], arrowright: [1, 0], arrowup: [0, -1], arrowdown: [0, 1]}[key];
  if (direction && (placement || surfaces.every(s => s.hidden) || e.target === document.body)) {
    e.preventDefault();
    if (placement) {
      pointer.inside = false;
      placementTile = [placementTile[0] + direction[0], placementTile[1] + direction[1]];
    } else moveCamera(direction[0] * 49, direction[1] * 49);
  }
  if (placement && key === 'enter' && !e.repeat) { e.preventDefault(); finishPlacement(); }
});
addEventListener('pagehide', () => saveGame());
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
function updateResources(dt) {
  const actual = {flux: state.bank.flux, energy: state.energy, rate: netOutput(state)};
  const speed = 1 - Math.exp(-dt * 20);
  for (const key of Object.keys(actual)) {
    uiNumbers[key] = Math.abs(actual[key] - uiNumbers[key]) < .023 ? actual[key] : lerp(uiNumbers[key], actual[key], speed);
  }
  setText('flux-value', amount(uiNumbers.flux, 2));
  setText('energy-value', compact(roundedEnergy(uiNumbers.energy)));
  const cap = totalCapacity(state);
  setText('capacity-value', ' / ' + amount(cap));
  setText('rate-value', amount(uiNumbers.rate, 1));
  setWidth('hud-energy', state.energy / cap * 100);
  setText('zoom-value', Math.round(camera.z * 100) + '%');
  const [x, y] = world(...center()).map(Math.round);
  const signed = n => (n < 0 ? '−' : '+') + String(Math.abs(n)).padStart(3, '0');
  setText('coordinates', 'X ' + signed(x) + '  Y ' + signed(y));
  setText('asset-count', String(state.buildings.length).padStart(2, '0') + ' MACHINES');
}
let previousFrame = null, lastInterface = -1;
const elsewhere = {complete: researchCompleted, shutdown: reactorShutDown, discovery: discoveryFound};
function frame(ms) {
  const elapsed = previousFrame === null ? 0 : Math.max(0, (ms - previousFrame) / 1000);
  previousFrame = ms;
  currentTime = ms / 1000;
  if (elapsed > 60) {
    const opened = Object.keys(game.worlds).length;
    showAway(offlineProgress(game, elapsed));
    if (Object.keys(game.worlds).length !== opened) renderSwitcher();
    techSignature = '';
  }
  let pending = elapsed > 60 ? 0 : elapsed;
  while (pending > 0) {
    const dt = Math.min(.5, pending);
    advanceState(state, dt, {complete: researchCompleted, sale: result => sell(1, true, result), shutdown: reactorShutDown, discovery: discoveryFound});
    for (const floor of state.peers) advanceState(floor, dt, elsewhere);
    pending -= dt;
  }
  const dt = Math.min(.1, elapsed);
  renderWorld(currentTime, dt);
  updateHoverCard();
  if ($('timing-cursor') && !panel.hidden) $('timing-cursor').style.left = timingPosition(currentTime) * 100 + '%';
  if (currentTime - lastInterface > .10) {
    lastInterface = currentTime;
    updateResources(.10); updateMachine(); drawMarket(); renderTech(); updateBuild(); updateSwitcher(); updateLegacy(); updateDiscoveryButton();
    updateMaterials();
    if (!ventureCardShown && ventureStatus(game) === 'ready') showVentureResult();
    updateProgramme();
  }
  if (currentTime - lastSave > 10) saveGame();
  if (audio && !document.hidden && totalOutput(state) > 0 && state.energy < totalCapacity(state) - .01 && currentTime - lastHum > 3.6) {
    lastHum = currentTime; sound('motor');
  }
  requestAnimationFrame(frame);
}
resize();
renderSwitcher();
updateDiscoveryButton();
if (viewing) {
  const note = $('stage-note');
  note.hidden = false;
  note.innerHTML = '<span>Looking at ' + {start: 'a new plant', mid: 'a plant in mid-game', end: 'a finished plant'}[viewing] +
    '. Nothing here is saved.</span>' + STAGES.filter(stage => stage !== viewing).map(stage =>
      '<a href="' + stageLink(stage) + '">' + stage[0].toUpperCase() + stage.slice(1) + '</a>').join('') +
    '<a href="' + myPlantLink() + '">Back to my plant</a>';
  saveText('Not saving');
  openingCamera();
}
if (!localReady) saveText('Export to save', true);
showAway(awaySummary);
$('offline-summary').addEventListener('click', event => { if (event.target.id === 'close-offline') $('offline-summary').hidden = true; });
if (state.splitCount === 0 && state.buildings.length === 3) openMachine(1, false);
requestAnimationFrame(frame);
</script>
</body>
